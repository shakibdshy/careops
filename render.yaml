# Render blueprint for the Go replica (the live-demo backend, Go-T15's
# Render edition): the same distroless Docker image the AWS tier ships —
# the binary applies its embedded PostgreSQL migrations BEFORE it serves —
# plus Render PostgreSQL and Render Key Value for the report cache.
#
#   Render dashboard → New → Blueprint → point at this repo.
#   Render reads this file at the repo root. The `sync: false` vars are
#   filled in the dashboard: BETTER_AUTH_URL and TRUSTED_ORIGINS are both
#   the Vercel web origin (https://<your-web>.vercel.app) — sign-in on the
#   web sends that origin, and the Go auth plane rejects untrusted origins
#   by design (the same knob the AWS stack wires from its two domains).
#
# Single-database-user note: Render's PostgreSQL exposes one master role and
# both connection strings below use it — migration 0009 (FORCE ROW LEVEL
# SECURITY) exists exactly for this mode, keeping the Organization guard
# load-bearing on the owner role too (ADR-0014).
#
# See docs/runbook.md → "Quick path: Render + Vercel".

services:
  - type: web
    name: careops-api-go
    runtime: docker
    dockerfilePath: ./apps/api-go/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SERVICE_NAME
        value: careops-api
      - key: IMPLEMENTATION
        value: go
      - key: DATABASE_URL
        fromDatabase:
          name: careops-go-pg
          property: connectionString
      - key: MIGRATIONS_DATABASE_URL
        fromDatabase:
          name: careops-go-pg
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: careops-go-redis
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: TRUSTED_ORIGINS
        sync: false

  - type: keyvalue
    name: careops-go-redis
    plan: free
    ipAllowList: []

databases:
  # Render's free PostgreSQL is deleted after 30 days — upgrade to a paid
  # plan (basic-256mb) in the dashboard to keep the demo data persistent.
  - name: careops-go-pg
    databaseName: careops_go
    plan: free
