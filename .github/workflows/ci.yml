name: CI

on:
  pull_request:
  # Reusable by deploy.yml (W3-T5): merges to main run these gates through the
  # deploy workflow — one full CI run per merge, not two.
  workflow_call:

jobs:
  ci:
    name: lint → typecheck → test → build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Coverage summary
        if: always()
        run: |
          SUMMARY=apps/api/coverage/coverage-summary.json
          if [ -f "$SUMMARY" ]; then
            LINES=$(jq -r '.total.lines.pct' "$SUMMARY")
            BRANCHES=$(jq -r '.total.branches.pct' "$SUMMARY")
            echo "### API coverage" >> "$GITHUB_STEP_SUMMARY"
            echo "| lines | branches |" >> "$GITHUB_STEP_SUMMARY"
            echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| ${LINES}% | ${BRANCHES}% |" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Build
        run: bun run build

      # PR safety (W3-T5): the stack must synthesize cleanly with no AWS
      # credentials — env-agnostic synth, template asserted on disk. Deploys
      # only ever happen on main (deploy.yml), never on a PR.
      - name: CDK synth (env-agnostic, no credentials)
        working-directory: infra
        run: |
          bunx cdk synth -c target=aws --quiet
          test -f cdk.out/CareOpsStack.template.json
          echo "template synthesized: $(wc -c < cdk.out/CareOpsStack.template.json) bytes"
